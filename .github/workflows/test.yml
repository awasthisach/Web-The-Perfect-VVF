name: Automated Vercel App Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Production Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    # E2E against production is optional; skip if deploy not ready
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Create Test File
        run: |
          mkdir -p tests
          cat << 'EOF' > tests/app.spec.js
          import { test, expect } from '@playwright/test';

          test('App loads and shows Google Login', async ({ page }) => {
            await page.goto('https://web-the-perfect-fnuzzcxae-awasthisachs-projects.vercel.app');
            const loginBtn = page.getByText('Sign in with Google');
            await expect(loginBtn).toBeVisible({ timeout: 20000 });
          });
          EOF

      - name: Run E2E Tests
        run: npx playwright test tests/app.spec.js
