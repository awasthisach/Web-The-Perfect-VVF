name: Automated Vercel App Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Production Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Create Test File
        run: |
          mkdir -p tests
          cat << 'EOF' > tests/app.spec.js
          import { test, expect } from '@playwright/test';

          test('App loads and shows Google Login or Dashboard', async ({ page }) => {
            await page.goto('https://web-the-perfect-vvf.vercel.app');
            // Either login button or already-connected dashboard
            const loginBtn = page.getByText('Sign in with Google');
            const dashboard = page.getByText('Files Table');
            await expect(loginBtn.or(dashboard)).toBeVisible({ timeout: 25000 });
          });
          EOF

      - name: Run E2E Tests
        run: npx playwright test tests/app.spec.js
